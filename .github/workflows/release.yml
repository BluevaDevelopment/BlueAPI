name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs so two pushes can't race the build counter.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 25, not 21: velocity compiles with --release 25 (velocity-api 4.0.0 needs JVM 25).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # Same counter logic as before: year.build, resetting the build number
      # when the year changes.
      #
      # The bump is committed and pushed *before* the deploy: pushing to main is
      # what actually claims a build number. Doing it afterwards let two runs
      # queued around the same time compute the same number (the loser then hit
      # a 409 from the release repo, which never accepts a rewrite), and let a
      # run lose its bump to a rejected push after it had already published.
      # A burned number when the build fails is the cheap side of that trade.
      # Pushes made with GITHUB_TOKEN don't retrigger this workflow; the
      # [skip ci] marker is extra insurance.
      - name: Claim next version
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            # Always count from the tip of main: this job may have been queued
            # behind a push (or behind another run's bump) since checkout.
            git fetch origin main
            git reset --hard origin/main

            CURRENT_YEAR="$(date +%y)"
            YEAR="$CURRENT_YEAR"
            BUILD=0
            if [[ -f build.properties ]]; then
              source build.properties
              YEAR="${year:-$CURRENT_YEAR}"
              BUILD="${build:-0}"
            fi
            if [[ "$YEAR" != "$CURRENT_YEAR" ]]; then
              YEAR="$CURRENT_YEAR"
              BUILD=0
            fi
            BUILD=$((BUILD + 1))
            REVISION="$YEAR.$BUILD"

            printf 'year=%s\nbuild=%s\n' "$YEAR" "$BUILD" > build.properties
            # Point the README's badge and per-module install snippets at the new version.
            sed -i \
              -e "s|version-[^-]*-blue|version-$REVISION-blue|" \
              -e "s|net.blueva.foundation:BlueFoundation\([A-Za-z-]*\):[0-9][^\"'\`]*|net.blueva.foundation:BlueFoundation\1:$REVISION|g" \
              -e "s|<version>[^<]*</version>|<version>$REVISION</version>|" \
              README.md

            git add build.properties README.md
            git commit -m "build: bump version to $REVISION [skip ci]"
            if git push origin HEAD:main; then
              echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
              echo "Building BlueFoundation $REVISION"
              exit 0
            fi
            echo "main moved while claiming $REVISION, retrying (attempt $attempt)"
          done

          echo "::error::could not claim a build number after 5 attempts"
          exit 1

      # Build + test everything first, so a failure stops the job before any
      # publish step runs.
      - name: Build and test all modules
        run: ./gradlew build --no-daemon

      # One publish step per module, so a failure shows up against the
      # specific platform instead of one opaque step.
      - name: Publish common
        env:
          BLUEVA_REPO_USERNAME: ${{ secrets.BLUEVA_REPO_USERNAME }}
          BLUEVA_REPO_SECRET: ${{ secrets.BLUEVA_REPO_SECRET }}
        run: ./gradlew :common:publish --no-daemon

      - name: Publish bukkit
        env:
          BLUEVA_REPO_USERNAME: ${{ secrets.BLUEVA_REPO_USERNAME }}
          BLUEVA_REPO_SECRET: ${{ secrets.BLUEVA_REPO_SECRET }}
        run: ./gradlew :bukkit:publish --no-daemon

      - name: Publish velocity
        env:
          BLUEVA_REPO_USERNAME: ${{ secrets.BLUEVA_REPO_USERNAME }}
          BLUEVA_REPO_SECRET: ${{ secrets.BLUEVA_REPO_SECRET }}
        run: ./gradlew :velocity:publish --no-daemon

      - name: Publish bungeecord
        env:
          BLUEVA_REPO_USERNAME: ${{ secrets.BLUEVA_REPO_USERNAME }}
          BLUEVA_REPO_SECRET: ${{ secrets.BLUEVA_REPO_SECRET }}
        run: ./gradlew :bungeecord:publish --no-daemon

      - name: Publish hytale
        env:
          BLUEVA_REPO_USERNAME: ${{ secrets.BLUEVA_REPO_USERNAME }}
          BLUEVA_REPO_SECRET: ${{ secrets.BLUEVA_REPO_SECRET }}
        run: ./gradlew :hytale:publish --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ steps.version.outputs.revision }}
        run: |
          gh release create "v$REVISION" */build/libs/*-"$REVISION".jar \
            --title "BlueFoundation $REVISION" --generate-notes --target "$(git rev-parse HEAD)"
